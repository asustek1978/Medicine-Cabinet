name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create version release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/medicine_cabinet/manifest.json"))["version"])')"
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "Medicine Cabinet $TAG" \
            --notes-file - <<'EOF'
          ## Medicine Cabinet v0.4.4

          - Выпадающий список мест хранения и собственные места.
          - Защита от повторного добавления одной упаковки по серийному номеру.
          - Обновлённые brand-иконки и `mdi:pill-multiple` в боковой панели.
          - Сохранены компактные карточки, `Правка`, защищённые `Списать` и `−1`.
          - HACS-ready структура репозитория, HACS validation и Home Assistant hassfest.

          После установки/обновления полностью перезапустите Home Assistant.
          EOF
