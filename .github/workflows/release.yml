name: Release

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Create version release if missing
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/medicine_cabinet/manifest.json"))["version"])')"
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          awk -v version="$VERSION" '
            $0 == "## " version { found=1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > /tmp/changelog-section.md

          {
            echo "## Medicine Cabinet $TAG"
            echo
            if [[ -s /tmp/changelog-section.md ]]; then
              cat /tmp/changelog-section.md
            else
              echo "См. CHANGELOG.md для списка изменений."
            fi
            echo
            echo "После установки/обновления полностью перезапустите Home Assistant."
          } > /tmp/release-notes.md

          gh release create "$TAG" \
            --target "$TARGET_SHA" \
            --title "Medicine Cabinet $TAG" \
            --notes-file /tmp/release-notes.md
